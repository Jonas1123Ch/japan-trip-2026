<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7e5f50">
<title>出國攜帶清單｜日本旅行 2026</title>
<style>
:root{
  --bg:#f7f3ee;--paper:#fffdf9;--ink:#2f2a27;--muted:#7c726c;--line:#eadfd8;
  --rose:#d9a7a0;--accent:#7e5f50;--green:#567a68;--shadow:0 16px 42px rgba(75,54,42,.09)
}
*{box-sizing:border-box}
body{
  margin:0;background:radial-gradient(circle at top right,rgba(217,167,160,.18),transparent 30rem),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6
}
.container{max-width:900px;margin:auto;padding:16px 16px 70px}
.hero{
  border-radius:28px;background:linear-gradient(145deg,#77594c 0%,#94705f 48%,#af8877 100%);
  color:#fff;padding:27px 22px;box-shadow:var(--shadow)
}
.kicker{font-size:12px;letter-spacing:.14em;opacity:.76;text-transform:uppercase}
h1{font-size:clamp(27px,6vw,42px);line-height:1.18;margin:7px 0 7px}
.hero p{margin:0;opacity:.86;font-size:14px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:12px;
  padding:10px 14px;font:inherit;font-weight:800;cursor:pointer
}
.btn-light{background:white;color:var(--accent)}
.btn-ghost{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.24);color:#fff}
.progress-card{
  margin:15px 0;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:0 8px 24px rgba(67,52,42,.04)
}
.progress-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.progress-track{height:9px;background:#eee6e1;border-radius:999px;overflow:hidden;margin-top:8px}
.progress-bar{height:100%;width:0;background:var(--green);transition:width .2s ease}
.packing{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(70,51,40,.05)}
.pack-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pack-group{border:1px solid var(--line);border-radius:15px;padding:12px 13px;background:#fff}
.pack-group h2{font-size:15px;margin:0 0 7px}
.pack-item{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:#5f5651;padding:6px 0;cursor:pointer}
.pack-item input{margin-top:4px;accent-color:var(--accent);width:17px;height:17px}
.pack-item:has(input:checked){color:#9a918c;text-decoration:line-through}
.tip{margin-top:14px;padding:12px 13px;border-radius:13px;background:#faf6f1;border:1px dashed #ddc9bd;font-size:12px;color:#655a55}
.footer{margin-top:23px;text-align:center;color:var(--muted);font-size:12px}
.back-top{
  position:fixed;right:18px;bottom:20px;z-index:60;width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(126,95,80,.18);background:rgba(126,95,80,.94);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;
  box-shadow:0 10px 24px rgba(62,44,35,.22);opacity:0;pointer-events:none;
  transform:translateY(8px);transition:.2s ease
}
.back-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
@media(max-width:700px){.pack-grid{grid-template-columns:1fr}.hero{border-radius:22px}.container{padding:12px 12px 60px}}
</style>
</head>
<body>
<div class="container">
  <section class="hero">
    <div class="kicker">Japan Trip · Packing List</div>
    <h1>🧳 出國攜帶清單</h1>
    <p>日本 9 天 8 夜｜勾選狀態會保留在這台裝置的瀏覽器裡。</p>
    <div class="actions">
      <a class="btn btn-light" href="index.html">← 回行程首頁</a>
      <button class="btn btn-ghost" onclick="resetPacking()">重新清空</button>
    </div>
  </section>

  <div class="progress-card">
    <div class="progress-top"><b>準備進度</b><span id="progress-text">0 / 0</span></div>
    <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
  </div>

  <section class="packing">
    <div class="pack-grid">
      <div class="pack-group"><h2>🪪 證件・金錢</h2>
        <label class="pack-item"><input type="checkbox" data-pack="passport">護照</label>
        <label class="pack-item"><input type="checkbox" data-pack="cash">日幣現金</label>
        <label class="pack-item"><input type="checkbox" data-pack="cards">信用卡／提款卡</label>
        <label class="pack-item"><input type="checkbox" data-pack="tickets">機票、飯店、島風、Rapi:t 等預約 QR／電子票</label>
        <label class="pack-item"><input type="checkbox" data-pack="insurance">旅遊保險資料／緊急聯絡資訊</label>
        <label class="pack-item"><input type="checkbox" data-pack="ic">Suica／ICOCA／manaca 等 IC 卡</label>
      </div>

      <div class="pack-group"><h2>💊 藥品・隨身用品</h2>
        <label class="pack-item"><input type="checkbox" data-pack="meds">固定口服藥／處方藥</label>
        <label class="pack-item"><input type="checkbox" data-pack="basicmed">退燒止痛、腸胃、暈車等常備藥</label>
        <label class="pack-item"><input type="checkbox" data-pack="kidsmed">兒童常備藥與體溫計</label>
        <label class="pack-item"><input type="checkbox" data-pack="bandage">OK 繃／簡易藥膏</label>
        <label class="pack-item"><input type="checkbox" data-pack="tissue">口罩、濕紙巾、衛生紙、乾洗手</label>
        <label class="pack-item"><input type="checkbox" data-pack="toiletry">牙刷、保養／盥洗用品</label>
      </div>

      <div class="pack-group"><h2>🔌 3C・電力</h2>
        <label class="pack-item"><input type="checkbox" data-pack="phone">手機</label>
        <label class="pack-item"><input type="checkbox" data-pack="charger">充電器</label>
        <label class="pack-item"><input type="checkbox" data-pack="cables">USB-C／Lightning 等充電線</label>
        <label class="pack-item"><input type="checkbox" data-pack="powerbank">行動電源（放隨身行李）</label>
        <label class="pack-item"><input type="checkbox" data-pack="wifi">eSIM／SIM／Wi-Fi</label>
        <label class="pack-item"><input type="checkbox" data-pack="adapter">轉接頭（有三孔插頭設備時再帶）</label>
      </div>

      <div class="pack-group"><h2>👕 衣物・天氣</h2>
        <label class="pack-item"><input type="checkbox" data-pack="clothes">換洗衣物／內衣襪</label>
        <label class="pack-item"><input type="checkbox" data-pack="jacket">薄外套／可分層穿搭</label>
        <label class="pack-item"><input type="checkbox" data-pack="shoes">好走的鞋</label>
        <label class="pack-item"><input type="checkbox" data-pack="umbrella">摺疊傘</label>
        <label class="pack-item"><input type="checkbox" data-pack="laundry">洗衣袋／髒衣袋</label>
        <label class="pack-item"><input type="checkbox" data-pack="hat">帽子／防曬</label>
      </div>

      <div class="pack-group"><h2>👧 親子用品</h2>
        <label class="pack-item"><input type="checkbox" data-pack="stroller">推車</label>
        <label class="pack-item"><input type="checkbox" data-pack="kidclothes">小孩備用衣物</label>
        <label class="pack-item"><input type="checkbox" data-pack="kidsnacks">小孩零食／水壺</label>
        <label class="pack-item"><input type="checkbox" data-pack="blanket">薄毯／睡覺小物</label>
        <label class="pack-item"><input type="checkbox" data-pack="raincover">推車雨罩</label>
        <label class="pack-item"><input type="checkbox" data-pack="kidtoilet">如廁備品／濕紙巾／備用塑膠袋</label>
      </div>

      <div class="pack-group"><h2>🧳 行李・其他</h2>
        <label class="pack-item"><input type="checkbox" data-pack="bags">可折疊購物袋／備用行李袋</label>
        <label class="pack-item"><input type="checkbox" data-pack="lock">行李鎖／行李吊牌</label>
        <label class="pack-item"><input type="checkbox" data-pack="organizer">收納袋／壓縮袋</label>
        <label class="pack-item"><input type="checkbox" data-pack="bottle">環保水瓶</label>
        <label class="pack-item"><input type="checkbox" data-pack="pen">原子筆</label>
        <label class="pack-item"><input type="checkbox" data-pack="zipbag">夾鏈袋／塑膠袋</label>
      </div>
    </div>
    <div class="tip">提醒：行動電源不可放托運行李；處方藥建議保留原包裝。出發前一週可再依最新天氣刪減衣物。</div>
  </section>

  <div class="footer">Japan Trip 2026｜Packing Checklist｜與主行程使用同一個網站</div>
</div>
<button class="back-top" id="back-top" aria-label="回到頂部" title="回到頂部">↑</button>
<script>
const boxes=[...document.querySelectorAll("[data-pack]")];
function updateProgress(){
  const checked=boxes.filter(x=>x.checked).length;
  document.getElementById("progress-text").textContent=checked+" / "+boxes.length;
  document.getElementById("progress-bar").style.width=(boxes.length?checked/boxes.length*100:0)+"%";
}
boxes.forEach(cb=>{
  const key="japan-trip-pack-"+cb.dataset.pack;
  cb.checked=localStorage.getItem(key)==="1";
  cb.addEventListener("change",()=>{
    localStorage.setItem(key,cb.checked?"1":"0");
    updateProgress();
  });
});
function resetPacking(){
  if(!confirm("要清空所有勾選項目嗎？")) return;
  boxes.forEach(cb=>{
    cb.checked=false;
    localStorage.removeItem("japan-trip-pack-"+cb.dataset.pack);
  });
  updateProgress();
}
updateProgress();
const backTop=document.getElementById("back-top");
window.addEventListener("scroll",()=>{
  backTop.classList.toggle("show",window.scrollY>400);
},{passive:true});
backTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
</script>
</body>
</html>
